  <figcaption><b>Figure 4.2 — One 16-bit SPI transfer in mode 1 (CPOL = 0, CPHA = 1).</b> Both sides shift a new bit out on every rising SCLK edge and sample it on the falling edge, half a period later; the break marks the ten middle bits left out. MISO is high-impedance until chip select goes low, which is why several peripherals can share it.</figcaption>
