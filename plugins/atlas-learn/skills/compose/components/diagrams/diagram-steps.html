<!-- atlas-learn component: diagrams/diagram-steps.html · use when: a mechanism is best understood one layer at a time — a filter cycle, a message exchange, a derivation that adds a term per step · replace: the figure id and title id, the base drawing, one g[data-step] layer per step, one caption per step in ol.diagram-steps, the figcaption · runtime: step-through (Prev / Step k of n / Next / All, arrow keys) plus diagrams (zoom) · validator: step diagram … has fewer than 2 data-step layers; step diagram …: n captions for m steps -->
<figure class="diagram" id="fig-plan-row" data-steps data-cite="#ref-atlas-learn-docs">
  <svg viewBox="0 0 900 400" role="img" aria-labelledby="fig-plan-row-t"><title id="fig-plan-row-t">One plan row built up in three steps: dispatch, write and report, gate and tick</title>
    <rect class="d-box accent" x="80" y="150" width="220" height="100" rx="10"/>
    <text class="d-text b" x="190" y="192" text-anchor="middle">Main agent</text>
    <text class="d-text xs" x="190" y="216" text-anchor="middle">holds PLAN.md and the gates</text>
    <rect class="d-box" x="600" y="150" width="220" height="100" rx="10"/>
    <text class="d-text b" x="710" y="192" text-anchor="middle">Subagent</text>
    <text class="d-text xs" x="710" y="216" text-anchor="middle">e.g. module-researcher</text>
    <g data-step="1">
      <path class="d-line d-ctrl" d="M300 185 H598" marker-end="url(#arr-ctrl)"/>
      <text class="d-text mono sm" x="450" y="172" text-anchor="middle">BRIEF · DOSSIER · MODULES</text>
      <text class="d-text xs" x="450" y="204" text-anchor="middle">dispatch: file paths, never contents</text>
    </g>
    <g data-step="2">
      <rect class="d-box alt" x="620" y="30" width="180" height="60" rx="8"/>
      <text class="d-text mono" x="710" y="66" text-anchor="middle">m03-*.md</text>
      <path class="d-line d-data" d="M710 148 V92" marker-end="url(#arr-data)"/>
      <text class="d-text xs" x="720" y="124" text-anchor="start">writes its own file</text>
      <path class="d-line d-dash" d="M600 232 H302" marker-end="url(#arr-muted)"/>
      <text class="d-text mono sm" x="450" y="252" text-anchor="middle">RESULT: modules=M03 sources=14 …</text>
    </g>
    <g data-step="3">
      <rect class="d-box ctl" x="80" y="300" width="220" height="64" rx="8"/>
      <text class="d-text mono" x="190" y="328" text-anchor="middle">check_dossier.py</text>
      <text class="d-text xs" x="190" y="348" text-anchor="middle">status=PASS</text>
      <path class="d-line d-ctrl" d="M190 250 V298" marker-end="url(#arr-ctrl)"/>
      <path class="d-line d-ctrl" d="M300 332 H418" marker-end="url(#arr-ctrl)"/>
      <text class="d-text mono sm" x="430" y="337" text-anchor="start">PLAN.md · | [x] | M03 | research |</text>
    </g>
  </svg>
  <ol class="diagram-steps">
    <li><b>Step 1 — dispatch.</b> The main agent sends the subagent the paths it needs to read and write; the files themselves never enter the main agent's context.</li>
    <li><b>Step 2 — write and report.</b> The subagent writes its own file and answers with one RESULT line naming what it produced.</li>
    <li><b>Step 3 — gate and tick.</b> The main agent runs the gate on the file the RESULT line named; only a PASS flips the plan row to [x].</li>
  </ol>
  <figcaption><b>Figure 3.3 — The life of one plan row.</b> Use the controls (or ← →) to step; “All” shows the finished picture.</figcaption>
  <div class="legend"><span class="lg-control">Dispatch and gate</span><span class="lg-data">Write</span></div>
</figure>
