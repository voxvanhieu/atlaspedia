<figure class="diagram" id="fig-c8-rc-filter" data-cite="#ref-placeholder">
  <svg viewBox="0 0 260 140" width="520" role="img" aria-labelledby="fig-c8-rc-filter-t"><title id="fig-c8-rc-filter-t">First-order RC low-pass filter: VIN through R1 to VOUT, C1 from the output node to ground</title>

    <use href="#sym-resistor" x="80" y="60"/>

    <text class="d-text b" x="28" y="64" text-anchor="end">VIN</text>
    <text class="d-text b" x="100" y="46" text-anchor="middle">R1</text>
    <text class="d-text mono" x="100" y="80" text-anchor="middle">1.6 kΩ</text>

    <text class="d-text b" x="212" y="64">VOUT</text>
  </svg>
  <figcaption><b>Figure 4.2 — An RC low-pass filter drawn from library symbols.</b> R1 = 1.6 kΩ and C1 = 100 nF put the −3 dB corner at 1/(2π·R1·C1) ≈ 995 Hz; above it the output falls by 20 dB per decade.</figcaption>
