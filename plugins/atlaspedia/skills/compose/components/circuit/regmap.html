<figure class="regmap" id="fig-c8-spi-regs" data-cite="#ref-placeholder">
  <template>
  {
    "width": 32,
    "registers": [
      { "addr": "0x00", "name": "CTRL", "reset": "0x00000700", "desc": "Control", "fields": [
        {"name": "RSVD", "msb": 31, "lsb": 12, "access": "RSVD"},
        {"name": "BITS", "msb": 11, "lsb": 8, "access": "RW", "desc": "Frame length minus one (7 = 8-bit frames)"},
        {"name": "RSVD", "msb": 7, "lsb": 6, "access": "RSVD"},
        {"name": "LSBF", "msb": 5, "lsb": 5, "access": "RW", "desc": "1 = least significant bit first"},
        {"name": "CPHA", "msb": 4, "lsb": 4, "access": "RW", "desc": "Clock phase: 1 = sample on the second edge"},
        {"name": "CPOL", "msb": 3, "lsb": 3, "access": "RW", "desc": "Clock polarity: 1 = SCK idles high"},
        {"name": "MSTR", "msb": 2, "lsb": 2, "access": "RW", "desc": "1 = controller, 0 = peripheral"},
        {"name": "RST", "msb": 1, "lsb": 1, "access": "WO", "desc": "Write 1 to flush both FIFOs; reads as 0"},
        {"name": "EN", "msb": 0, "lsb": 0, "access": "RW", "desc": "Enable the block; clear it before changing CPOL or CPHA"}
      ]},
      { "addr": "0x04", "name": "STATUS", "reset": "0x00000002", "desc": "Status and error flags", "fields": [
        {"name": "RSVD", "msb": 31, "lsb": 8, "access": "RSVD"},
        {"name": "OVR", "msb": 7, "lsb": 7, "access": "W1C", "desc": "Receive overrun: a frame arrived with the FIFO full"},
        {"name": "MODF", "msb": 6, "lsb": 6, "access": "W1C", "desc": "Mode fault: SS pulled low while MSTR = 1"},
        {"name": "RSVD", "msb": 5, "lsb": 3, "access": "RSVD"},
        {"name": "BUSY", "msb": 2, "lsb": 2, "access": "RO", "desc": "A frame is on the wire"},
        {"name": "TXE", "msb": 1, "lsb": 1, "access": "RO", "desc": "Transmit FIFO empty"},
        {"name": "RXNE", "msb": 0, "lsb": 0, "access": "RO", "desc": "Receive FIFO not empty"}
      ]},
      { "addr": "0x08", "name": "DATA", "reset": "0x00000000", "desc": "Transmit / receive FIFO port", "fields": [
        {"name": "RSVD", "msb": 31, "lsb": 16, "access": "RSVD"},
        {"name": "DATA", "msb": 15, "lsb": 0, "access": "RW", "desc": "A write queues one frame; a read pops one received frame"}
      ]},
      { "addr": "0x0C", "name": "CLKDIV", "reset": "0x00000004", "desc": "SCK divider", "fields": [
        {"name": "RSVD", "msb": 31, "lsb": 8, "access": "RSVD"},
        {"name": "DIV", "msb": 7, "lsb": 0, "access": "RW", "desc": "SCK = f_PCLK / (2 × (DIV + 1)); 4 gives 5 MHz from 50 MHz"}
      ]}
    ]
  }
  </template>
  <figcaption><b>Figure 4.5 — The four registers of the SPI0 block (base address 0x4001_3000).</b> Clear EN before changing CPOL or CPHA; OVR and MODF stay set until software writes 1 to them, and TXE is the only flag set after reset.</figcaption>
</figure>
