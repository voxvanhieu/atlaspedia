<figure class="field" id="c7-field-low" data-fx="-y - 0.2*x" data-fy="x - 0.2*y" data-x="-3,3,x" data-y="-3,3,y" data-grid="16" data-trajectories="2.5,0; -1,2" data-labels="start at (2.5, 0), start at (−1, 2)" data-cite="#ref-placeholder">
  <figcaption><b>Figure 1.5 — Phase portrait of the linear system dx/dt = −y − 0.2x, dy/dt = x − 0.2y.</b> Every arrow points along the field the two equations define; colour encodes its magnitude, from small (blue) to large (orange). The two trajectories are integrated from the dots and spiral anticlockwise into the origin. The figure shows these equations and nothing else: a page that plots a physical flow uses the field its source documents.</figcaption>
</figure>
