<figure class="fnplot" id="c6-fnplot-cylindrical" data-fn="cos(p*pi/180)/cos(x*pi/180); ln(tan(pi/4 + x*pi/360))" data-x="-75,75,latitude φ [°]" data-y="-3,4" data-vars="p=0:60:5:30" data-labels="scale factor k = cos p / cos φ (standard parallel p), Mercator ordinate y(φ)" data-cite="#ref-placeholder">
  <figcaption><b>Figure 1.4 — Scale factor of a cylindrical projection and the Mercator ordinate against latitude.</b> Move the standard parallel p: k equals 1 on the two parallels ±p, shrinks between them and grows without bound towards the poles, which is why Web Mercator stops at ±85.05°. The Mercator ordinate y = ln tan(π/4 + φ/2) grows just as fast.</figcaption>
</figure>
